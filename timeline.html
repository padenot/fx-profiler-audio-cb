<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Timeline Visualization</title>
    <link rel="stylesheet" href="timeline.css">
    <script src="d3.min.js"></script>
    <script src="timeline.js"></script>
</head>
<body>
    <div id="timeline-container">
        <svg id="timeline"></svg>
    </div>
    <div id="media-status">Current Time: <span id="current-time-display">0:00</span></div>
    <div id="marker-details">
        <table>
            <tr>
                <th>Module</th>
                <th>Name</th>
                <th>Timestamp</th>
            </tr>
            <tr>
                <td id="marker-module"></td>
                <td id="marker-name"></td>
                <td id="marker-timestamp"></td> 
            </tr>
        </table>
    </div>

</body>
</html>
