<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Timeline Visualization</title>
    <link rel="stylesheet" href="timeline.css">
    <script src="d3.min.js"></script>
    <script src="timeline.js"></script>
</head>
<body>
    <!-- Timeline section -->
    <div id="timeline-section">
        <div id="timeline-container">
            <svg id="timeline"></svg>
        </div>
    </div>

    <!-- Details section -->
    <div id="details-section">
        <div id="marker-details-container">
            <table id="marker-details">
                <thead>
                    <tr>
                        <th>Module</th>
                        <th>Name</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Marker rows will be dynamically added here -->
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
